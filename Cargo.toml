[package]
name = "file_search_app"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Fast & Lightweight Rust File Search Tool"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default", "glow", "wayland", "x11"] }
rayon = "1.10"
rfd = "0.14"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
arboard = "3.4"
directories = "5.0"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
clipboard-win = "5"

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
